name: Engine benchmark

on:
  workflow_dispatch:
    inputs:
      url:
        description: "HTTP(S) URL with byte-range support (100 MB test file by default)"
        required: false
        default: "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz"

permissions:
  contents: read

jobs:
  benchmark:
    name: 8 / 16 / 24 / 48 segments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run real-network benchmark
        env:
          BENCH_URL: ${{ inputs.url }}
        run: >
          ./gradlew testDebugUnitTest
          --tests "com.abhi.armz.engine.EngineBenchmarkTest"
          -Darmz.benchmarkUrl="$BENCH_URL"
          --stacktrace

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore
