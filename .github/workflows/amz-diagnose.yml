name: AMz UI compile diagnostic

on:
  workflow_dispatch:
  push:
    branches: [feat/amz-downloader-app]

permissions:
  contents: read

concurrency:
  group: amz-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - run: chmod +x gradlew
      - run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Compile canvas UI Kotlin
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || '' }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || '' }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY || '' }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET || '' }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID || '' }}
        run: |
          set -o pipefail
          ./gradlew :app:compileArm64FossDebugKotlin --continue --no-configuration-cache --console=plain --warning-mode summary --max-workers=2 2>&1 | tee kotlin-diagnose.log || true
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          summary = pathlib.Path("kotlin-diagnose.log").read_text(errors="replace")
          count = 0
          for raw in summary.splitlines():
              line = re.sub(r"^\d{4}-\d{2}-\d{2}T\S+\s+", "", raw)
              line = re.sub(r"\x1b\[[0-9;]*m", "", line)
              match = re.search(r"^e: file:///(.*?):(\d+):(\d+): (.*)$", line)
              if not match:
                  continue
              path, line_no, col, message = match.groups()
              rel = path.split("/swiftdm/", 1)[-1] if "/swiftdm/" in path else path
              print(f"::error file={rel},line={line_no},col={col}::{message}")
              count += 1
          print(f"AMz Kotlin diagnostic errors: {count}")
          sys.exit(1 if count else 0)
          PY
