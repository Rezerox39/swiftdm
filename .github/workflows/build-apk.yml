name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage ARMz debug APK
        run: cp app/build/outputs/apk/debug/*.apk ARMz-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMz-debug
          path: ARMz-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Publish preview release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: ARMz-debug
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          prerelease: true
          name: "ARMz ${{ github.ref_name }} · P2 preview"
          body: |
            P2 preview build of ARMz (debug APK).

            Included in this build:
            - Pure-Kotlin segmented download engine: ranged requests, resume with ETag/Last-Modified
              validation, 5xx retry with exponential backoff, single-stream fallback, SHA-256 check.
            - Debug-only **Engine Lab** (Downloads → Engine Lab): URL, 1–16 segments, start, pause,
              resume, cancel, live speed/ETA and per-segment progress.
            - Room persistence for download rows and diff-only segment checkpoints.

            P2 adds the public storage hand-off: fast random-access `.part` downloads, coverage
            verification, fsync, cancellable SHA-256, MediaStore pending publish to
            `Downloads/ARMz`, and final `Completed` state only after the file is published.

            Install: download the APK and allow install from unknown sources when prompted.
