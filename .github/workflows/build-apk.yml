name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Test web UI
        working-directory: web
        run: npm run test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage ARMz debug APK
        run: cp app/build/outputs/apk/debug/*.apk ARMz-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMz-debug
          path: ARMz-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Publish preview release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: ARMz-debug
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          prerelease: true
          name: "ARMz ${{ github.ref_name }} · U1 preview"
          body: |
            U1 preview build of ARMz (debug APK).

            Included in this build:
            - Reworked U1 WebView UI: AMOLED-black hierarchy, clearer download rows, filter
              counts, bulk controls, action sheets, toasts, a two-step Add Download flow, and
              settings that only expose working controls.
            - Faster starts: no duplicate URL probe, persisted parallel-connection setting
              (16 by default), computed ETA, and clearer live speed/remaining-time readouts.
            - Launcher, adaptive and monochrome icons now show a white AMz wordmark on black.
            - React 18 + TypeScript + Tailwind UI built with Vite and bundled into the APK.
            - React Bits motion components (Aurora, BlurText, CountUp, Magnet, SpringCheck,
              Stepper), used under MIT + Commons Clause; see `THIRD_PARTY_NOTICES.md`.
            - Typed JSON-only JavaScript bridge with Kotlin validation, throttled native events,
              Android 12 splash fallback, safe-area/IME CSS variables and high/low perf tier.

            Install: download the APK and allow install from unknown sources when prompted.
