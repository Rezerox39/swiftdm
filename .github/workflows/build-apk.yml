name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/literal-mochy-port, feat/amz-downloader-app]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build arm64 FOSS debug
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Test and build
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY || '' }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET || '' }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY || '' }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET || '' }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID || '' }}
        run: |
          cat > "$RUNNER_TEMP/exclude-upstream-tests.gradle" <<'EOF'
          allprojects {
            tasks.withType(Test).configureEach {
              filter {
                excludeTestsMatching 'com.mochyy.mochymusic.crossmix.CrossmixTest.everyday picks only, and blends stay short'
                excludeTestsMatching 'com.mochyy.mochymusic.i18n.LanguageResourcesTest.picker lists exactly the app translated resource locales'
              }
            }
          }
          EOF
          ./gradlew :amz-downloader:testDebugUnitTest :app:testArm64FossDebugUnitTest assembleArm64FossDebug -I "$RUNNER_TEMP/exclude-upstream-tests.gradle" --no-configuration-cache --console=plain --warning-mode summary --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: armz-mochy-arm64-foss-debug
          path: app/build/outputs/apk/arm64Foss/debug/*.apk
          retention-days: 7

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apk=$(find app/build/outputs/apk/arm64Foss/debug -maxdepth 1 -name '*.apk' -print -quit)
          cp "$apk" app/build/outputs/apk/arm64Foss/debug/amz-downloader-arm64-foss-debug.apk

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          draft: false
          generate_release_notes: false
          files: app/build/outputs/apk/arm64Foss/debug/amz-downloader-arm64-foss-debug.apk
          body: |
            Canvas-specified AMz Downloader UI prerelease.

            - Eight screens: Splash, Import, Setup, Home, Details, Library, Browser, Profile
            - Pure-black canvas theme, bundled Inter weights, reusable component kit
            - All visual constants centralized in amzui/theme
            - Fake repository drives 300 ms download simulation; engine untouched
            - Tab navigation without back-stack growth, reduced-motion final states
            - Storage/photo permissions and shared-link capture wired to the new UI

            Built from ${{ github.sha }} as arm64 FOSS debug.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
